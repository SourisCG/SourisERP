# Production override (option B: VPS + Caddy with automatic HTTPS)
# Usage:
#   cp .env.prod.example .env.prod
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Images can be pre-built by CI and pushed to GHCR, then pulled on the server.

services:
  postgres:
    ports: []
    restart: unless-stopped

  pgadmin:
    profiles: ["local-only"]

  backend:
    ports: []
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CORS_ALLOWED_ORIGINS: https://${DOMAIN:?DOMAIN is required}

  frontend:
    ports: []
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: erp-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro,Z
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
