name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  publish:
    name: Publish images to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Option A: Render - create two Deploy Hooks in the Render dashboard and add
  # them as repository secrets RENDER_BACKEND_HOOK / RENDER_FRONTEND_HOOK.
  deploy-render:
    name: Trigger Render deploy
    needs: publish
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}
    steps:
      - name: Backend
        if: ${{ secrets.RENDER_BACKEND_HOOK != '' }}
        run: curl -fsS -X POST "${{ secrets.RENDER_BACKEND_HOOK }}"
      - name: Frontend
        if: ${{ secrets.RENDER_FRONTEND_HOOK != '' }}
        run: curl -fsS -X POST "${{ secrets.RENDER_FRONTEND_HOOK }}"

  # Option B: VPS - add SSH_HOST, SSH_USER and SSH_KEY secrets and set
  # VPS_DEPLOY=true as a repository variable.
  deploy-vps:
    name: Deploy on VPS (docker compose)
    needs: publish
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && vars.VPS_DEPLOY == 'true' }}
    steps:
      - name: Pull and restart over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /opt/erp-core
            git pull --ff-only
            docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod up -d --build
            docker compose ps
