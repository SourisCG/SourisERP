spring:
  application:
    name: erp-core
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/erp}
    username: ${SPRING_DATASOURCE_USERNAME:erp}
    password: ${SPRING_DATASOURCE_PASSWORD:erp}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  messages:
    basename: i18n/messages
    fallback-to-system-locale: false
    encoding: UTF-8
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    url: /openapi.yaml
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    try-it-out-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: ERP Core
    description: Hexagonal ERP portfolio - API-First, Spring Boot 4, Java 21
    version: 1.0.0

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-change-me-in-production}
    access-token-ttl: ${JWT_ACCESS_TTL:PT30M}
    issuer: ${JWT_ISSUER:erp-core}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  security:
    login-rate-limit:
      max-attempts: ${LOGIN_RATE_LIMIT_MAX:20}
      window: ${LOGIN_RATE_LIMIT_WINDOW:PT1M}
  demo:
    mode: ${DEMO_MODE:false}
