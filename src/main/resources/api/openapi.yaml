openapi: 3.1.0
info:
  title: ERP Core API
  version: 1.0.0
  description: |
    Enterprise Resource Planning core API.

    This document is the **single source of truth**: server interfaces are generated
    from it at build time (API-First), controllers implement the generated interfaces.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: /
    description: Same origin (backend)

tags:
  - name: Auth
    description: Authentication and current session
  - name: Users
    description: User management (RBAC)
  - name: Roles
    description: Available roles
  - name: Categories
    description: Product categories
  - name: Products
    description: Product catalog
  - name: Warehouses
    description: Physical warehouses
  - name: Inventory
    description: Stock levels and movements (optimistic locking)
  - name: Customers
    description: Sales customers
  - name: SalesOrders
    description: Sales orders and their lifecycle
  - name: Suppliers
    description: Purchase suppliers
  - name: PurchaseOrders
    description: Purchase orders, approval and receiving
  - name: Invoices
    description: Customer invoices, payments and PDF
  - name: Reports
    description: Business reports (JSON and CSV)
  - name: Audit
    description: Audit trail of domain changes
  - name: Demo
    description: Demo data management (portfolio mode)

security:
  - bearerAuth: []

paths:
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Authenticate and obtain a JWT access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Get the authenticated user profile
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List users (paged)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: search
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Page of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Users]
      operationId: createUser
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: Created
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      operationId: getUser
      summary: Get a user by id
      responses:
        '200':
          description: User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Users]
      operationId: updateUser
      summary: Update a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Users]
      operationId: deleteUser
      summary: Disable a user (soft delete)
      responses:
        '204':
          description: Disabled
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/users/{id}/roles:
    parameters:
      - $ref: '#/components/parameters/UserId'
    put:
      tags: [Users]
      operationId: assignRoles
      summary: Replace the roles of a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRolesRequest'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/roles:
    get:
      tags: [Roles]
      operationId: listRoles
      summary: List available roles
      responses:
        '200':
          description: Roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleResponse'

  /api/v1/categories:
    get:
      tags: [Categories]
      operationId: listCategories
      summary: List all categories
      parameters:
        - name: search
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryResponse'
    post:
      tags: [Categories]
      operationId: createCategory
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/categories/{id}:
    parameters:
      - $ref: '#/components/parameters/CategoryId'
    get:
      tags: [Categories]
      operationId: getCategory
      summary: Get a category
      responses:
        '200':
          description: Category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Categories]
      operationId: updateCategory
      summary: Update a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Categories]
      operationId: deleteCategory
      summary: Delete a category (fails if it has products or subcategories)
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/products:
    get:
      tags: [Products]
      operationId: listProducts
      summary: List products (paged)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: search
          in: query
          schema: { type: string }
        - name: categoryId
          in: query
          schema: { type: integer, format: int64 }
        - name: active
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Page of products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageProduct'
    post:
      tags: [Products]
      operationId: createProduct
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/products/{id}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      tags: [Products]
      operationId: getProduct
      summary: Get a product
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Products]
      operationId: updateProduct
      summary: Update a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Products]
      operationId: deactivateProduct
      summary: Deactivate a product (soft delete)
      responses:
        '204':
          description: Deactivated
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/warehouses:
    get:
      tags: [Warehouses]
      operationId: listWarehouses
      summary: List warehouses
      responses:
        '200':
          description: Warehouses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WarehouseResponse'
    post:
      tags: [Warehouses]
      operationId: createWarehouse
      summary: Create a warehouse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WarehouseRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarehouseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/warehouses/{id}:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
    get:
      tags: [Warehouses]
      operationId: getWarehouse
      summary: Get a warehouse
      responses:
        '200':
          description: Warehouse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarehouseResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Warehouses]
      operationId: updateWarehouse
      summary: Update a warehouse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WarehouseRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarehouseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Warehouses]
      operationId: deleteWarehouse
      summary: Delete a warehouse (fails if it holds stock)
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/inventory:
    get:
      tags: [Inventory]
      operationId: listInventory
      summary: List stock levels
      parameters:
        - name: warehouseId
          in: query
          schema: { type: integer, format: int64 }
        - name: productId
          in: query
          schema: { type: integer, format: int64 }
        - name: lowStockThreshold
          in: query
          schema: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Stock levels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InventoryItemResponse'

  /api/v1/inventory/movements:
    get:
      tags: [Inventory]
      operationId: listStockMovements
      summary: List stock movements (paged ledger)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: productId
          in: query
          schema: { type: integer, format: int64 }
        - name: warehouseId
          in: query
          schema: { type: integer, format: int64 }
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/MovementType'
      responses:
        '200':
          description: Page of movements
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageStockMovement'

  /api/v1/inventory/adjustments:
    post:
      tags: [Inventory]
      operationId: adjustStock
      summary: Set the physical quantity of an item (records an ADJUSTMENT movement)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdjustmentRequest'
      responses:
        '200':
          description: Updated stock level
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItemResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/inventory/transfers:
    post:
      tags: [Inventory]
      operationId: transferStock
      summary: Transfer stock between warehouses
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequest'
      responses:
        '204':
          description: Transferred
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/customers:
    get:
      tags: [Customers]
      operationId: listCustomers
      summary: List customers (paged)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: search
          in: query
          schema: { type: string }
        - name: active
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Page of customers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageCustomer'
    post:
      tags: [Customers]
      operationId: createCustomer
      summary: Create a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/customers/{id}:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
    get:
      tags: [Customers]
      operationId: getCustomer
      summary: Get a customer
      responses:
        '200':
          description: Customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Customers]
      operationId: updateCustomer
      summary: Update a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Customers]
      operationId: deactivateCustomer
      summary: Deactivate a customer (soft delete)
      responses:
        '204':
          description: Deactivated
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/sales-orders:
    get:
      tags: [SalesOrders]
      operationId: listSalesOrders
      summary: List sales orders (paged)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: search
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/SalesOrderStatus'
        - name: customerId
          in: query
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Page of sales orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageSalesOrder'
    post:
      tags: [SalesOrders]
      operationId: createSalesOrder
      summary: Create a draft sales order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesOrderRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/sales-orders/{id}:
    parameters:
      - $ref: '#/components/parameters/SalesOrderId'
    get:
      tags: [SalesOrders]
      operationId: getSalesOrder
      summary: Get a sales order
      responses:
        '200':
          description: Sales order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrderResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [SalesOrders]
      operationId: updateSalesOrder
      summary: Update a draft sales order (replaces its lines)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesOrderRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/sales-orders/{id}/confirm:
    parameters:
      - $ref: '#/components/parameters/SalesOrderId'
    post:
      tags: [SalesOrders]
      operationId: confirmSalesOrder
      summary: Confirm the order (reserves stock in the selected warehouses)
      responses:
        '200':
          description: Confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrderResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/sales-orders/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/SalesOrderId'
    post:
      tags: [SalesOrders]
      operationId: cancelSalesOrder
      summary: Cancel the order (releases reserved stock)
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrderResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/suppliers:
    get:
      tags: [Suppliers]
      operationId: listSuppliers
      summary: List suppliers (paged)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: search
          in: query
          schema: { type: string }
        - name: active
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Page of suppliers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageSupplier'
    post:
      tags: [Suppliers]
      operationId: createSupplier
      summary: Create a supplier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/suppliers/{id}:
    parameters:
      - $ref: '#/components/parameters/SupplierId'
    get:
      tags: [Suppliers]
      operationId: getSupplier
      summary: Get a supplier
      responses:
        '200':
          description: Supplier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Suppliers]
      operationId: updateSupplier
      summary: Update a supplier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Suppliers]
      operationId: deactivateSupplier
      summary: Deactivate a supplier (soft delete)
      responses:
        '204':
          description: Deactivated
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/purchase-orders:
    get:
      tags: [PurchaseOrders]
      operationId: listPurchaseOrders
      summary: List purchase orders (paged)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: search
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/PurchaseOrderStatus'
        - name: supplierId
          in: query
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Page of purchase orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagePurchaseOrder'
    post:
      tags: [PurchaseOrders]
      operationId: createPurchaseOrder
      summary: Create a draft purchase order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseOrderRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/purchase-orders/{id}:
    parameters:
      - $ref: '#/components/parameters/PurchaseOrderId'
    get:
      tags: [PurchaseOrders]
      operationId: getPurchaseOrder
      summary: Get a purchase order
      responses:
        '200':
          description: Purchase order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [PurchaseOrders]
      operationId: updatePurchaseOrder
      summary: Update a draft purchase order (replaces its lines)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseOrderRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/purchase-orders/{id}/approve:
    parameters:
      - $ref: '#/components/parameters/PurchaseOrderId'
    post:
      tags: [PurchaseOrders]
      operationId: approvePurchaseOrder
      summary: Approve a draft purchase order
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/purchase-orders/{id}/receive:
    parameters:
      - $ref: '#/components/parameters/PurchaseOrderId'
    post:
      tags: [PurchaseOrders]
      operationId: receivePurchaseOrder
      summary: Receive the goods (adds stock and refreshes product cost)
      responses:
        '200':
          description: Received
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/purchase-orders/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/PurchaseOrderId'
    post:
      tags: [PurchaseOrders]
      operationId: cancelPurchaseOrder
      summary: Cancel a purchase order
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/invoices:
    get:
      tags: [Invoices]
      operationId: listInvoices
      summary: List invoices (paged)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: search
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/InvoiceStatus'
        - name: customerId
          in: query
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Page of invoices
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageInvoice'
    post:
      tags: [Invoices]
      operationId: createInvoice
      summary: Issue an invoice from a confirmed sales order (ships stock)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/invoices/{id}:
    parameters:
      - $ref: '#/components/parameters/InvoiceId'
    get:
      tags: [Invoices]
      operationId: getInvoice
      summary: Get an invoice
      responses:
        '200':
          description: Invoice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/invoices/{id}/payments:
    parameters:
      - $ref: '#/components/parameters/InvoiceId'
    post:
      tags: [Invoices]
      operationId: registerPayment
      summary: Register a (partial) payment against the invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '200':
          description: Updated invoice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/invoices/{id}/pdf:
    parameters:
      - $ref: '#/components/parameters/InvoiceId'
    get:
      tags: [Invoices]
      operationId: downloadInvoicePdf
      summary: Download the invoice as PDF (localized via Accept-Language)
      responses:
        '200':
          description: PDF document
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/reports/sales-summary:
    get:
      tags: [Reports]
      operationId: salesSummary
      summary: Monthly sales summary from issued invoices
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Sales summary
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SalesSummaryItem'

  /api/v1/reports/inventory-valuation:
    get:
      tags: [Reports]
      operationId: inventoryValuation
      summary: Inventory valuation at cost, grouped by warehouse
      responses:
        '200':
          description: Valuation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InventoryValuationItem'

  /api/v1/reports/receivables:
    get:
      tags: [Reports]
      operationId: receivables
      summary: Outstanding customer balances with aging
      responses:
        '200':
          description: Receivables
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReceivableItem'

  /api/v1/reports/{report}/export:
    get:
      tags: [Reports]
      operationId: exportReportCsv
      summary: Export a report as CSV (sales-summary | inventory-valuation | receivables)
      parameters:
        - name: report
          in: path
          required: true
          schema:
            type: string
            enum: [sales-summary, inventory-valuation, receivables]
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: CSV document
          content:
            text/csv:
              schema:
                type: string

  /api/v1/audit:
    get:
      tags: [Audit]
      operationId: listAuditEntries
      summary: List audit trail entries (paged)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: entityType
          in: query
          schema: { type: string }
        - name: action
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Page of audit entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageAuditEntry'

  /api/v1/demo/reset:
    post:
      tags: [Demo]
      operationId: resetDemoData
      summary: Reset the demo database to its seeded state (demo mode only)
      responses:
        '204':
          description: Reset scheduled
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    CategoryId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ProductId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    WarehouseId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    CustomerId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    SalesOrderId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    SupplierId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    PurchaseOrderId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    InvoiceId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: Validation error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Insufficient permissions
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Business conflict (duplicate, concurrent modification, insufficient stock)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Problem:
      type: object
      description: RFC 7807 problem details, localized via Accept-Language
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Stable machine-readable error code
        timestamp:
          type: string
          format: date-time
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      properties:
        field:
          type: string
        message:
          type: string

    PageMetadata:
      type: object
      properties:
        number: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
        password:
          type: string
          minLength: 8
          maxLength: 100

    TokenResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          description: Token lifetime in seconds
        user:
          $ref: '#/components/schemas/UserSummary'

    UserSummary:
      type: object
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        fullName: { type: string }
        email: { type: string, format: email }
        roles:
          type: array
          items: { type: string }
        enabled: { type: boolean }

    UserDetail:
      allOf:
        - $ref: '#/components/schemas/UserSummary'
        - type: object
          properties:
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    UserCreateRequest:
      type: object
      required: [username, email, firstName, lastName, password, roles]
      properties:
        username:
          type: string
          pattern: '^[a-z0-9._-]{3,50}$'
        email:
          type: string
          format: email
        firstName: { type: string, minLength: 1, maxLength: 80 }
        lastName: { type: string, minLength: 1, maxLength: 80 }
        password: { type: string, minLength: 8, maxLength: 100 }
        roles:
          type: array
          minItems: 1
          items: { type: string }
        enabled:
          type: boolean
          default: true

    UserUpdateRequest:
      type: object
      required: [email, firstName, lastName]
      properties:
        email: { type: string, format: email }
        firstName: { type: string, minLength: 1, maxLength: 80 }
        lastName: { type: string, minLength: 1, maxLength: 80 }
        enabled: { type: boolean }

    AssignRolesRequest:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          minItems: 1
          items: { type: string }

    RoleResponse:
      type: object
      properties:
        name: { type: string }
        description: { type: string }

    PageUser:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/UserSummary'
        page:
          $ref: '#/components/schemas/PageMetadata'

    UnitOfMeasure:
      type: string
      enum: [UNIT, KG, LITER, METER, BOX, PACK]

    CategoryRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 255 }
        parentId: { type: integer, format: int64 }

    CategoryResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string }
        parentId: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ProductRequest:
      type: object
      required: [sku, name, categoryId, unit, salePrice, costPrice]
      properties:
        sku: { type: string, minLength: 2, maxLength: 40, pattern: '^[A-Za-z0-9._-]+$' }
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        categoryId: { type: integer, format: int64 }
        unit: { $ref: '#/components/schemas/UnitOfMeasure' }
        salePrice: { type: number, minimum: 0, multipleOf: 0.01 }
        costPrice: { type: number, minimum: 0, multipleOf: 0.01 }
        taxRate: { type: number, minimum: 0, maximum: 100, multipleOf: 0.01, default: 21 }
        active: { type: boolean, default: true }

    ProductResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        sku: { type: string }
        name: { type: string }
        description: { type: string }
        categoryId: { type: integer, format: int64 }
        categoryName: { type: string }
        unit: { $ref: '#/components/schemas/UnitOfMeasure' }
        salePrice: { type: number }
        costPrice: { type: number }
        taxRate: { type: number }
        active: { type: boolean }
        version: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PageProduct:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ProductResponse'
        page:
          $ref: '#/components/schemas/PageMetadata'

    MovementType:
      type: string
      description: |
        INITIAL: opening stock, ADJUSTMENT: manual correction,
        TRANSFER_IN/OUT: warehouse transfer, PURCHASE_RECEIPT: goods received,
        SALE: shipped to customer, SALE_CANCEL: returned from cancelled order
      enum: [INITIAL, ADJUSTMENT, TRANSFER_IN, TRANSFER_OUT, PURCHASE_RECEIPT, SALE, SALE_CANCEL]

    WarehouseRequest:
      type: object
      required: [code, name]
      properties:
        code: { type: string, minLength: 2, maxLength: 20, pattern: '^[A-Za-z0-9_-]+$' }
        name: { type: string, minLength: 1, maxLength: 80 }
        address: { type: string, maxLength: 255 }
        active: { type: boolean, default: true }

    WarehouseResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
        address: { type: string }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    InventoryItemResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        productId: { type: integer, format: int64 }
        sku: { type: string }
        productName: { type: string }
        warehouseId: { type: integer, format: int64 }
        warehouseCode: { type: string }
        quantity: { type: integer }
        reservedQuantity: { type: integer }
        availableQuantity: { type: integer }
        version: { type: integer, format: int64 }
        updatedAt: { type: string, format: date-time }

    StockMovementResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        productId: { type: integer, format: int64 }
        sku: { type: string }
        productName: { type: string }
        warehouseId: { type: integer, format: int64 }
        warehouseCode: { type: string }
        type: { $ref: '#/components/schemas/MovementType' }
        quantity: { type: integer }
        referenceType: { type: string }
        referenceId: { type: integer, format: int64 }
        notes: { type: string }
        createdAt: { type: string, format: date-time }
        createdBy: { type: integer, format: int64 }

    PageStockMovement:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/StockMovementResponse'
        page:
          $ref: '#/components/schemas/PageMetadata'

    AdjustmentRequest:
      type: object
      required: [productId, warehouseId, newQuantity]
      properties:
        productId: { type: integer, format: int64 }
        warehouseId: { type: integer, format: int64 }
        newQuantity: { type: integer, minimum: 0 }
        reason: { type: string, maxLength: 255 }

    TransferRequest:
      type: object
      required: [productId, fromWarehouseId, toWarehouseId, quantity]
      properties:
        productId: { type: integer, format: int64 }
        fromWarehouseId: { type: integer, format: int64 }
        toWarehouseId: { type: integer, format: int64 }
        quantity: { type: integer, minimum: 1 }
        notes: { type: string, maxLength: 255 }

    CustomerRequest:
      type: object
      required: [code, name]
      properties:
        code: { type: string, minLength: 2, maxLength: 20, pattern: '^[A-Za-z0-9_-]+$' }
        name: { type: string, minLength: 1, maxLength: 120 }
        taxId: { type: string, maxLength: 30 }
        email: { type: string, format: email, maxLength: 150 }
        phone: { type: string, maxLength: 30 }
        address: { type: string, maxLength: 255 }
        active: { type: boolean, default: true }

    CustomerResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
        taxId: { type: string }
        email: { type: string }
        phone: { type: string }
        address: { type: string }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PageCustomer:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/CustomerResponse'
        page:
          $ref: '#/components/schemas/PageMetadata'

    SalesOrderStatus:
      type: string
      enum: [DRAFT, CONFIRMED, INVOICED, CANCELLED]

    SalesOrderLineRequest:
      type: object
      required: [productId, warehouseId, quantity]
      properties:
        productId: { type: integer, format: int64 }
        warehouseId: { type: integer, format: int64 }
        quantity: { type: integer, minimum: 1 }
        unitPrice: { type: number, minimum: 0, multipleOf: 0.01, description: Defaults to the product sale price }
        discount: { type: number, minimum: 0, maximum: 100, multipleOf: 0.01, default: 0 }

    SalesOrderLineResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        productId: { type: integer, format: int64 }
        sku: { type: string }
        productName: { type: string }
        warehouseId: { type: integer, format: int64 }
        quantity: { type: integer }
        unitPrice: { type: number }
        discount: { type: number }
        taxRate: { type: number }
        lineTotal: { type: number }

    SalesOrderRequest:
      type: object
      required: [customerId, lines]
      properties:
        customerId: { type: integer, format: int64 }
        orderDate: { type: string, format: date }
        notes: { type: string, maxLength: 500 }
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SalesOrderLineRequest'

    SalesOrderResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        number: { type: string }
        customerId: { type: integer, format: int64 }
        customerName: { type: string }
        status: { $ref: '#/components/schemas/SalesOrderStatus' }
        orderDate: { type: string, format: date }
        notes: { type: string }
        lines:
          type: array
          items:
            $ref: '#/components/schemas/SalesOrderLineResponse'
        subtotal: { type: number }
        taxTotal: { type: number }
        total: { type: number }
        version: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PageSalesOrder:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/SalesOrderResponse'
        page:
          $ref: '#/components/schemas/PageMetadata'

    SupplierRequest:
      type: object
      required: [code, name]
      properties:
        code: { type: string, minLength: 2, maxLength: 20, pattern: '^[A-Za-z0-9_-]+$' }
        name: { type: string, minLength: 1, maxLength: 120 }
        taxId: { type: string, maxLength: 30 }
        email: { type: string, format: email, maxLength: 150 }
        phone: { type: string, maxLength: 30 }
        address: { type: string, maxLength: 255 }
        active: { type: boolean, default: true }

    SupplierResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
        taxId: { type: string }
        email: { type: string }
        phone: { type: string }
        address: { type: string }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PageSupplier:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/SupplierResponse'
        page:
          $ref: '#/components/schemas/PageMetadata'

    PurchaseOrderStatus:
      type: string
      enum: [DRAFT, APPROVED, RECEIVED, CANCELLED]

    PurchaseOrderLineRequest:
      type: object
      required: [productId, warehouseId, quantity, unitCost]
      properties:
        productId: { type: integer, format: int64 }
        warehouseId: { type: integer, format: int64 }
        quantity: { type: integer, minimum: 1 }
        unitCost: { type: number, minimum: 0, multipleOf: 0.01 }

    PurchaseOrderLineResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        productId: { type: integer, format: int64 }
        sku: { type: string }
        productName: { type: string }
        warehouseId: { type: integer, format: int64 }
        quantity: { type: integer }
        unitCost: { type: number }
        lineTotal: { type: number }

    PurchaseOrderRequest:
      type: object
      required: [supplierId, lines]
      properties:
        supplierId: { type: integer, format: int64 }
        orderDate: { type: string, format: date }
        notes: { type: string, maxLength: 500 }
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PurchaseOrderLineRequest'

    PurchaseOrderResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        number: { type: string }
        supplierId: { type: integer, format: int64 }
        supplierName: { type: string }
        status: { $ref: '#/components/schemas/PurchaseOrderStatus' }
        orderDate: { type: string, format: date }
        notes: { type: string }
        lines:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseOrderLineResponse'
        subtotal: { type: number }
        version: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PagePurchaseOrder:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseOrderResponse'
        page:
          $ref: '#/components/schemas/PageMetadata'

    InvoiceStatus:
      type: string
      enum: [ISSUED, PARTIALLY_PAID, PAID]

    InvoiceRequest:
      type: object
      required: [salesOrderId]
      properties:
        salesOrderId: { type: integer, format: int64 }
        dueDate: { type: string, format: date, description: Defaults to issue date + 30 days }

    InvoiceLineResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        productId: { type: integer, format: int64 }
        sku: { type: string }
        productName: { type: string }
        quantity: { type: integer }
        unitPrice: { type: number }
        taxRate: { type: number }
        lineTotal: { type: number }
        lineTax: { type: number }

    PaymentResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        amount: { type: number }
        method: { type: string }
        reference: { type: string }
        paidAt: { type: string, format: date-time }

    InvoiceResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        number: { type: string }
        salesOrderId: { type: integer, format: int64 }
        salesOrderNumber: { type: string }
        customerId: { type: integer, format: int64 }
        customerName: { type: string }
        status: { $ref: '#/components/schemas/InvoiceStatus' }
        issueDate: { type: string, format: date }
        dueDate: { type: string, format: date }
        subtotal: { type: number }
        taxTotal: { type: number }
        total: { type: number }
        paidAmount: { type: number }
        balance: { type: number }
        lines:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceLineResponse'
        payments:
          type: array
          items:
            $ref: '#/components/schemas/PaymentResponse'
        createdAt: { type: string, format: date-time }

    PageInvoice:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceResponse'
        page:
          $ref: '#/components/schemas/PageMetadata'

    PaymentRequest:
      type: object
      required: [amount, method]
      properties:
        amount: { type: number, exclusiveMinimum: 0, multipleOf: 0.01 }
        method:
          type: string
          enum: [CASH, CARD, TRANSFER, OTHER]
        reference: { type: string, maxLength: 60 }

    SalesSummaryItem:
      type: object
      properties:
        period: { type: string, description: 'YYYY-MM' }
        invoiceCount: { type: integer, format: int64 }
        subtotal: { type: number }
        taxTotal: { type: number }
        total: { type: number }

    InventoryValuationItem:
      type: object
      properties:
        warehouseId: { type: integer, format: int64 }
        warehouseCode: { type: string }
        totalQuantity: { type: integer, format: int64 }
        totalCost: { type: number }
        totalRetail: { type: number }

    ReceivableItem:
      type: object
      properties:
        invoiceId: { type: integer, format: int64 }
        invoiceNumber: { type: string }
        customerId: { type: integer, format: int64 }
        customerName: { type: string }
        dueDate: { type: string, format: date }
        total: { type: number }
        paidAmount: { type: number }
        balance: { type: number }
        daysOverdue: { type: integer }

    AuditEntryResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        entityType: { type: string }
        action: { type: string }
        entityRef: { type: string }
        username: { type: string }
        userId: { type: integer, format: int64 }
        afterJson: { type: string }
        createdAt: { type: string, format: date-time }

    PageAuditEntry:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntryResponse'
        page:
          $ref: '#/components/schemas/PageMetadata'
